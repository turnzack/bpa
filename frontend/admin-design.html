<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Admin Design Studio - Tiger IA</title>
    <script>
      // PURGE TOTALE AUTOMATIQUE ET FORCE RELOAD CACHE CHROME V109
      (function() {
        var CLEAN_KEY = 'tiger_v109_purged_final';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var reg of regs) { reg.unregister(); }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) { caches.delete(name); }
          }).catch(function() {});
        }
        if (!localStorage.getItem(CLEAN_KEY)) {
          localStorage.setItem(CLEAN_KEY, 'true');
          setTimeout(function() { window.location.reload(true); }, 100);
        }
      })();
    </script>
    <script>
      // Firewall réseau global Zero-Error pour mode Web Cloud SaaS
      (function() {
        var isElectron = Boolean(window.electron || window.electronAPI || (navigator.userAgent && navigator.userAgent.indexOf('Electron') !== -1));
        var origFetch = window.fetch;
        
        function shouldBlock(url) {
          if (!url) return false;
          if (typeof url !== 'string') url = String(url);
          if (url.indexOf('turborepo-summary') !== -1 || url.indexOf('console.neon.tech') !== -1 || url.indexOf('ingest.sentry.io') !== -1) {
            return 'mock_ok';
          }
          if (url.indexOf('localhost:500') !== -1 || url.indexOf('127.0.0.1:500') !== -1 || url.indexOf(':5006') !== -1) {
            if (!isElectron) {
              return 'rewrite_relative';
            }
          }
          return false;
        }

        window.fetch = function(input, init) {
          var url = '';
          try {
            if (typeof input === 'string') { url = input; }
            else if (input && input.url) { url = input.url; }
            else if (input && input.href) { url = input.href; }
            else if (input) { url = String(input); }
          } catch(e) {}
          
          var blockType = shouldBlock(url);
          if (blockType === 'rewrite_relative') {
            var relPath = url.replace(/^https?:\/\/[^\/]+/, '');
            if (!relPath.startsWith('/')) relPath = '/' + relPath;
            return origFetch.call(this, relPath, init);
          }
          
          var blockType = shouldBlock(url);
          if (blockType === 'mock_ok') {
            return Promise.resolve(new Response(JSON.stringify({ ok: true, success: true }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
          }
          if (blockType === 'mock_blocked') {
            return Promise.resolve(new Response(JSON.stringify({ success: false, cloud_blocked: true }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
          }
          return origFetch.apply(this, arguments);
        };

        if (window.XMLHttpRequest && window.XMLHttpRequest.prototype) {
          var origOpen = window.XMLHttpRequest.prototype.open;
          var origSend = window.XMLHttpRequest.prototype.send;

          window.XMLHttpRequest.prototype.open = function(method, url) {
            var blockType = shouldBlock(url);
            if (blockType) {
              this._isBlocked = true;
              return;
            }
            return origOpen.apply(this, arguments);
          };

          window.XMLHttpRequest.prototype.send = function(body) {
            if (this._isBlocked) {
              try {
                Object.defineProperty(this, 'status', { value: 200, writable: true });
                Object.defineProperty(this, 'statusText', { value: 'OK', writable: true });
                Object.defineProperty(this, 'readyState', { value: 4, writable: true });
                Object.defineProperty(this, 'responseText', { value: '{"success":false,"cloud_blocked":true}', writable: true });
                Object.defineProperty(this, 'response', { value: '{"success":false,"cloud_blocked":true}', writable: true });
              } catch(e) {}
              var self = this;
              setTimeout(function() {
                if (typeof self.onreadystatechange === 'function') { self.onreadystatechange(); }
                if (typeof self.onload === 'function') { self.onload(); }
              }, 0);
              return;
            }
            return origSend.apply(this, arguments);
          };
        }

        if (navigator && navigator.sendBeacon) {
          var origBeacon = navigator.sendBeacon;
          navigator.sendBeacon = function(url, data) {
            if (shouldBlock(url)) return true;
            return origBeacon.apply(this, arguments);
          };
        }
      })();

      document.addEventListener('wheel', function(e) { if (e.ctrlKey) { e.preventDefault(); } }, { passive: false });
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '0' || e.key === '+' || e.code === 'NumpadAdd' || e.code === 'NumpadSubtract')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin-design.tsx"></script>
  </body>
</html>
