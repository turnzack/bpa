server {
    listen 80;
    listen [::]:80;
    server_name 109.205.182.17 _;

    # Racine de l'interface Web compilée (Vite)
    root /var/www/tiger/dist;
    index index.html;

    client_max_body_size 150M;

    # Proxy vers l'API Backend Node.js PM2 (Port 5006)
    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy vers l'API v1 Bridge & Ingestion (/v1/bridge/inject, /v1/bridge/poll, etc.)
    location /v1/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy pour le bridge Kirov
    location /bridge/ {
        proxy_pass http://127.0.0.1:5006/bridge/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Proxy pour le serveur de preview Vite (Port 5173)
    location /preview/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Routage SPA React (Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
