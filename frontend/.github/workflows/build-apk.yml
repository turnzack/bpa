name: 📱 Build Mobile APK Souverain

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nom du projet à compiler en APK'
        required: true
        default: 'pack'
      app_label:
        description: 'Nom public affiché sur le téléphone'
        required: false
        default: 'Mon App Souveraine'

permissions:
  contents: write

jobs:
  build-apk:
    name: 🚀 Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du Code Source
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Configuration de Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔍 Détection et Build Web du Projet
        run: |
          PROJ="${{ github.event.inputs.project_name }}"
          echo "Projet sélectionné : $PROJ"
          
          TARGET_DIR=""
          # 1. Chercher dans le dépôt local git
          if [ -d "boilerplates/projets/$PROJ" ]; then
            TARGET_DIR="boilerplates/projets/$PROJ"
          elif [ -d "v0saveprojets/$PROJ" ]; then
            TARGET_DIR="v0saveprojets/$PROJ"
          elif [ -d "$PROJ" ] && [ "$PROJ" != "." ]; then
            TARGET_DIR="$PROJ"
          fi
          
          # 2. Si le projet n'est pas dans le git, le récupérer en direct depuis le VPS Souverain (109.205.182.17)
          if [ -z "$TARGET_DIR" ]; then
            echo "Projet non présent dans le dépôt Git, téléchargement depuis le serveur VPS Cloud (109.205.182.17)..."
            mkdir -p "/tmp/target_project"
            if curl -fSL --connect-timeout 15 "http://109.205.182.17/api/mobile/project-archive?project=${PROJ}" -o /tmp/project.tar.gz; then
              tar -xzf /tmp/project.tar.gz -C "/tmp/target_project"
              if [ -d "/tmp/target_project/$PROJ" ]; then
                TARGET_DIR="/tmp/target_project/$PROJ"
              else
                TARGET_DIR="/tmp/target_project"
              fi
              echo "✅ Code source de $PROJ récupéré avec succès depuis le VPS !"
            else
              echo "❌ ERREUR CRITIQUE : Projet $PROJ introuvable dans le Git ET sur le VPS !"
              echo "Impossible de compiler un APK sans les sources du projet."
              exit 1
            fi
          fi
          
          echo "Dossier cible validé : $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # S'assurer que vite.config utilise des chemins relatifs pour Capacitor (base: './')
          if [ -f "vite.config.ts" ]; then
            sed -i "s/base: *['\"][^'\"]*['\"]/base: '.\/'/g" vite.config.ts || true
          fi
          if [ -f "vite.config.js" ]; then
            sed -i "s/base: *['\"][^'\"]*['\"]/base: '.\/'/g" vite.config.js || true
          fi
          
          # Installer dépendances et compiler le Web (dist)
          pnpm install --no-frozen-lockfile --config.ignore-scripts=false || npm install --legacy-peer-deps
          
          # Installer express et cors si src/backend existe
          if [ -d "src/backend" ] || [ -f "src/backend/server.ts" ]; then
            npm install express cors @types/express @types/cors --save-dev --legacy-peer-deps || true
          fi
          
          # Compiler le frontend avec Vite (npx vite build génère dist/ sans être bloqué par tsc sur le backend)
          npx vite build || pnpm run build || npm run build
          
          if [ ! -d "dist" ]; then
            echo "Tentative de build Vite forcé..."
            npx vite build --emptyOutDir || true
          fi
          
          echo "DIST_DIR=$(pwd)/dist" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: ⚡ Intégration Capacitor & Android
        run: |
          cd "${{ env.PROJECT_DIR }}"
          pnpm add -D @capacitor/core @capacitor/cli @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
          
          # Initialiser capacitor si non existant
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "${{ github.event.inputs.app_label }}" "com.souverain.${{ github.event.inputs.project_name }}" --web-dir dist
          fi
          
          # Ajouter la plateforme Android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Synchroniser les assets web compilés dans le projet Android
          npx cap sync android

      - name: 🔨 Compilation APK Native avec Gradle
        run: |
          cd "${{ env.PROJECT_DIR }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          # Renommer l'APK généré avec le nom officiel du projet
          APK_SRC=$(find "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            PROJ_CLEAN="${{ github.event.inputs.project_name }}"
            cp "$APK_SRC" "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/${PROJ_CLEAN}.apk"
            echo "APK_FINAL_PATH=${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/${PROJ_CLEAN}.apk" >> $GITHUB_ENV
          fi

      - name: 📤 Découverte et Publication de l'APK en Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📱 Publication Directe dans les Releases Publiques Souveraines
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0-apk
          name: "📱 Fichiers APK Android Souverains"
          files: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
