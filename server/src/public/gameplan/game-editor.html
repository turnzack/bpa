<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Editor 3D - SolarScan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
        }

        /* Header */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            border-bottom: 2px solid #4ade80;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        /* Mode Switcher */
        .mode-switcher {
            display: flex;
            gap: 5px;
        }

        .mode-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #4ade80;
            border-color: #4ade80;
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        /* Asset Panel */
        #asset-panel {
            position: fixed;
            left: 0;
            top: 50px;
            width: 200px;
            bottom: 60px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 2px solid #4ade80;
            overflow-y: auto;
            z-index: 900;
        }

        .asset-category {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .asset-category h3 {
            color: #4ade80;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .asset-item {
            padding: 8px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .asset-item:hover {
            background: rgba(74, 222, 128, 0.3);
        }

        .asset-item:active {
            transform: scale(0.95);
        }

        /* Viewport */
        #viewport {
            position: fixed;
            left: 200px;
            top: 50px;
            right: 0;
            bottom: 60px;
            background: #0f0f1e;
        }

        #viewport canvas {
            width: 100%;
            height: 100%;
        }

        /* Toolbar */
        #toolbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #4ade80;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            z-index: 1000;
        }

        .toolbar-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar-btn:active {
            transform: scale(0.95);
        }

        .toolbar-btn.primary {
            background: #4ade80;
            border-color: #4ade80;
        }

        /* Game Controls (Hidden by default) */
        #game-controls {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 180px;
            z-index: 1100;
        }

        #game-controls.active {
            display: block;
        }

        /* Virtual Joystick */
        .joystick-base {
            position: absolute;
            bottom: 30px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(74, 222, 128, 0.8);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }

        /* Action Buttons */
        .action-btn {
            position: absolute;
            bottom: 30px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .action-btn:active {
            background: rgba(74, 222, 128, 0.5);
            transform: scale(0.9);
        }

        .btn-jump {
            right: 50px;
        }

        .btn-run {
            right: 140px;
            bottom: 80px;
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2000;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4ade80;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Status */
        #status {
            position: fixed;
            top: 60px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #4ade80;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 999;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div id="header">
        <h1>🎮 Game Editor 3D</h1>
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="3d">3D</button>
            <button class="mode-btn" data-mode="2d">2D</button>
            <button class="mode-btn" data-mode="render">Render</button>
            <button class="mode-btn" data-mode="game">Game</button>
        </div>
    </div>

    <!-- Asset Panel -->
    <div id="asset-panel">
        <div class="asset-category">
            <h3>📦 Primitives</h3>
            <div class="asset-item" data-type="cube">Cube</div>
            <div class="asset-item" data-type="sphere">Sphere</div>
            <div class="asset-item" data-type="plane">Plan</div>
        </div>

        <div class="asset-category">
            <h3>🎭 Characters</h3>
            <div id="character-list">
                <!-- Populated dynamically -->
            </div>
        </div>

        <div class="asset-category">
            <h3>🏗️ Objects</h3>
            <div id="object-list">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Viewport -->
    <div id="viewport"></div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button class="toolbar-btn" id="btn-clear">🗑️ Clear</button>
        <button class="toolbar-btn" id="btn-save">💾 Save</button>
        <button class="toolbar-btn" id="btn-load">📥 Load</button>
        <button class="toolbar-btn primary" id="btn-play">▶️ Play</button>
    </div>

    <!-- Game Controls (Hidden by default) -->
    <div id="game-controls">
        <div class="joystick-base">
            <div class="joystick-stick"></div>
        </div>
        <button class="action-btn btn-jump">A<br><small>Jump</small></button>
        <button class="action-btn btn-run">B<br><small>Run</small></button>
    </div>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>

    <!-- Status -->
    <div id="status">Mode: 3D Editor</div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- Game Editor Core -->
    <script src="js/SceneManager.js"></script>
    <script src="js/AssetManager.js"></script>
    <script src="js/CharacterController.js"></script>
    <script src="js/VirtualJoystick.js"></script>
    <script src="js/GameMode.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
