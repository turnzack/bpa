<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Viewer 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial;
        }

        #info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            display: block;
        }

        .btn {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 119, 255, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 5px;
        }

        #btnRotate {
            left: 50%;
            transform: translateX(-120%);
        }

        #btnWire {
            left: 50%;
            transform: translateX(20%);
        }
    </style>
</head>

<body>
    <div id="info">Initialisation...</div>
    <button id="btnRotate" class="btn" style="display:none;" onclick="toggleRotate()">🔄 Auto</button>
    <button id="btnWire" class="btn" style="display:none;" onclick="toggleWire()">🕸️ Fil</button>

    <!-- Three.js r128 - Plus récent mais toujours compatible -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        var jobId = window.location.pathname.split('/').pop();
        var scene, camera, renderer, mesh;
        var autoRotate = false, wireframe = false;
        var mouseDown = false, mouseX = 0, mouseY = 0;

        function log(msg) {
            document.getElementById('info').innerHTML = msg;
            console.log(msg);
        }

        function init() {
            try {
                log('Initialisation 3D...');

                // Scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);

                // Camera
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 5);

                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(1); // Limiter pour performance WebView
                document.body.appendChild(renderer.domElement);

                // Lights
                var ambient = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambient);

                var light1 = new THREE.DirectionalLight(0xffffff, 0.5);
                light1.position.set(5, 5, 5);
                scene.add(light1);

                var light2 = new THREE.DirectionalLight(0xffffff, 0.3);
                light2.position.set(-5, -5, -5);
                scene.add(light2);

                // Mouse controls
                renderer.domElement.addEventListener('mousedown', onMouseDown);
                renderer.domElement.addEventListener('mousemove', onMouseMove);
                renderer.domElement.addEventListener('mouseup', onMouseUp);
                renderer.domElement.addEventListener('touchstart', onTouchStart);
                renderer.domElement.addEventListener('touchmove', onTouchMove);
                renderer.domElement.addEventListener('touchend', onTouchEnd);

                window.addEventListener('resize', onResize);

                // Load
                loadModel();

                // Animate
                animate();

            } catch (e) {
                log('Erreur init: ' + e.message);
            }
        }

        function loadModel() {
            log('Connexion serveur...');

            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/jobs/' + jobId);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    try {
                        var job = JSON.parse(xhr.responseText);
                        if (job.objUrl) {
                            log('Chargement modèle...');
                            loadOBJ(job.objUrl);
                        } else {
                            log('❌ Pas de modèle OBJ');
                        }
                    } catch (e) {
                        log('❌ Erreur parse: ' + e.message);
                    }
                } else {
                    log('❌ Job introuvable (404)');
                }
            };
            xhr.onerror = function () {
                log('❌ Erreur réseau');
            };
            xhr.send();
        }

        function loadOBJ(url) {
            try {
                if (!THREE.OBJLoader) {
                    log('❌ OBJLoader non disponible');
                    return;
                }

                var loader = new THREE.OBJLoader();

                loader.load(url,
                    function (object) {
                        log('Préparation affichage...');

                        // Center & scale
                        var box = new THREE.Box3().setFromObject(object);
                        var center = box.getCenter(new THREE.Vector3());
                        var size = box.getSize(new THREE.Vector3());
                        var maxDim = Math.max(size.x, size.y, size.z);
                        var scale = 4 / maxDim;

                        object.position.sub(center);
                        object.scale.setScalar(scale);

                        // Material simple
                        object.traverse(function (child) {
                            if (child.isMesh) {
                                child.material = new THREE.MeshPhongMaterial({
                                    color: 0xaaaaaa,
                                    shininess: 10,
                                    flatShading: false
                                });
                            }
                        });

                        mesh = object;
                        scene.add(mesh);

                        log('✅ Modèle chargé !<br><small>Glissez pour tourner</small>');
                        document.getElementById('btnRotate').style.display = 'block';
                        document.getElementById('btnWire').style.display = 'block';

                        setTimeout(function () {
                            document.getElementById('info').style.display = 'none';
                        }, 2000);
                    },
                    function (xhr) {
                        var percent = Math.round((xhr.loaded / xhr.total) * 100);
                        log('Chargement... ' + percent + '%');
                    },
                    function (error) {
                        log('❌ Erreur chargement<br><small>' + error + '</small>');
                    }
                );
            } catch (e) {
                log('❌ Erreur loader: ' + e.message);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (mesh) {
                if (autoRotate) {
                    mesh.rotation.y += 0.01;
                }
                renderer.render(scene, camera);
            }
        }

        function onMouseDown(e) {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onMouseMove(e) {
            if (mouseDown && mesh) {
                var deltaX = e.clientX - mouseX;
                var deltaY = e.clientY - mouseY;
                mesh.rotation.y += deltaX * 0.005;
                mesh.rotation.x += deltaY * 0.005;
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        }

        function onMouseUp() {
            mouseDown = false;
        }

        var touchX = 0, touchY = 0;
        function onTouchStart(e) {
            if (e.touches.length > 0) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        }

        function onTouchMove(e) {
            if (e.touches.length > 0 && mesh) {
                var deltaX = e.touches[0].clientX - touchX;
                var deltaY = e.touches[0].clientY - touchY;
                mesh.rotation.y += deltaX * 0.005;
                mesh.rotation.x += deltaY * 0.005;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
                e.preventDefault();
            }
        }

        function onTouchEnd() {
            // Nothing
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleRotate() {
            autoRotate = !autoRotate;
            document.getElementById('btnRotate').style.opacity = autoRotate ? '1' : '0.6';
        }

        function toggleWire() {
            wireframe = !wireframe;
            if (mesh) {
                mesh.traverse(function (child) {
                    if (child.isMesh) {
                        child.material.wireframe = wireframe;
                    }
                });
            }
            document.getElementById('btnWire').style.opacity = wireframe ? '1' : '0.6';
        }

        // Start
        window.onload = init;
    </script>
</body>

</html>
