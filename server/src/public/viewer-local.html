<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Viewer 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial;
        }

        #info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="info">Chargement Three.js...</div>

    <!-- Load Three.js from local server -->
    <script src="/three.min.js"></script>
    <script src="/OBJLoader.js"></script>

    <script>
        var jobId = window.location.pathname.split('/').pop();

        // Check if THREE loaded
        if (typeof THREE === 'undefined') {
            document.getElementById('info').innerHTML = '❌ Three.js non chargé<br><small>Vérifiez que three.min.js est dans /public</small>';
        } else {
            document.getElementById('info').innerText = 'Three.js chargé ! Initialisation...';
            initViewer();
        }

        function initViewer() {
            try {
                // Scene
                var scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);

                // Camera
                var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 5;

                // Renderer
                var renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // Lights
                var ambient = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambient);

                var light = new THREE.DirectionalLight(0xffffff, 0.5);
                light.position.set(5, 5, 5);
                scene.add(light);

                document.getElementById('info').innerText = 'Connexion serveur...';

                // Load model
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/jobs/' + jobId);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var job = JSON.parse(xhr.responseText);
                        if (job.objUrl) {
                            loadOBJ(job.objUrl, scene, camera, renderer);
                        } else {
                            document.getElementById('info').innerText = '❌ Pas de modèle OBJ';
                        }
                    } else {
                        document.getElementById('info').innerText = '❌ Job introuvable';
                    }
                };
                xhr.send();

                // Animate
                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

            } catch (e) {
                document.getElementById('info').innerHTML = '❌ Erreur: ' + e.message;
            }
        }

        function loadOBJ(url, scene, camera, renderer) {
            document.getElementById('info').innerText = 'Chargement modèle...';

            var loader = new THREE.OBJLoader();
            loader.load(url, function (object) {
                // Center & scale
                var box = new THREE.Box3().setFromObject(object);
                var center = box.getCenter(new THREE.Vector3());
                var size = box.getSize(new THREE.Vector3());
                var maxDim = Math.max(size.x, size.y, size.z);
                var scale = 4 / maxDim;

                object.position.sub(center);
                object.scale.setScalar(scale);

                // Material
                object.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshPhongMaterial({
                            color: 0xaaaaaa,
                            shininess: 10
                        });
                    }
                });

                scene.add(object);
                document.getElementById('info').style.display = 'none';

                // Mouse rotation
                var isDragging = false;
                var previousMousePosition = { x: 0, y: 0 };

                renderer.domElement.addEventListener('mousedown', function (e) {
                    isDragging = true;
                });

                renderer.domElement.addEventListener('mousemove', function (e) {
                    if (isDragging) {
                        var deltaX = e.clientX - previousMousePosition.x;
                        var deltaY = e.clientY - previousMousePosition.y;
                        object.rotation.y += deltaX * 0.005;
                        object.rotation.x += deltaY * 0.005;
                    }
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                renderer.domElement.addEventListener('mouseup', function () {
                    isDragging = false;
                });

            }, function (xhr) {
                var percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('info').innerText = 'Chargement... ' + percent + '%';
            }, function (error) {
                document.getElementById('info').innerHTML = '❌ Erreur chargement<br>' + error;
            });
        }
    </script>
</body>

</html>
