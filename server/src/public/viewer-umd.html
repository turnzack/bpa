<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Viewer 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial;
            font-size: 14px;
            z-index: 100;
        }
    </style>

    <!-- Three.js UMD (ES5 compatible IE11) - LOCAL FILES -->
    <script src="/three.min.js"></script>
    <script src="/OBJLoader.js"></script>
</head>

<body>
    <div id="info">Initialisation...</div>

    <script>
        // Extract jobId from URL
        var pathParts = window.location.pathname.split('/');
        var jobId = pathParts[pathParts.length - 1];

        var info = document.getElementById('info');
        info.innerText = 'Job ' + jobId + ' - Initialisation...';

        // Check if THREE loaded
        if (typeof THREE === 'undefined') {
            info.innerHTML = '❌ Three.js non chargé<br>Vérifiez la connexion CDN';
        } else {
            info.innerText = 'Three.js chargé ! Configuration...';
            initViewer();
        }

        function initViewer() {
            try {
                // Scene
                var scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);

                // Camera
                var camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                camera.position.z = 5;

                // Renderer
                var renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // Lights
                var ambientLight = new THREE.AmbientLight(0x404040, 2);
                scene.add(ambientLight);

                var directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(1, 1, 1);
                scene.add(directionalLight);

                var backLight = new THREE.DirectionalLight(0xffffff, 0.5);
                backLight.position.set(-1, -1, -1);
                scene.add(backLight);

                // Manual mouse rotation (no OrbitControls needed)
                var isDragging = false;
                var previousMousePosition = { x: 0, y: 0 };
                var rotationObject = null; // This will be set when the model is loaded

                renderer.domElement.addEventListener('mousedown', function (e) {
                    isDragging = true;
                });

                renderer.domElement.addEventListener('mousemove', function (e) {
                    if (isDragging && rotationObject) {
                        var deltaX = e.clientX - previousMousePosition.x;
                        var deltaY = e.clientY - previousMousePosition.y;
                        rotationObject.rotation.y += deltaX * 0.005;
                        rotationObject.rotation.x += deltaY * 0.005;
                    }
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                renderer.domElement.addEventListener('mouseup', function () {
                    isDragging = false;
                });

                // Load model
                info.innerText = 'Connexion serveur...';

                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/jobs/' + jobId, true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        try {
                            var job = JSON.parse(xhr.responseText);
                            if (job.objUrl) {
                                loadModel(job.objUrl, scene);
                            } else {
                                info.innerText = '❌ Pas de modèle OBJ';
                            }
                        } catch (e) {
                            info.innerText = '❌ Erreur parse: ' + e.message;
                        }
                    } else {
                        info.innerText = '❌ Job introuvable (404)';
                    }
                };
                xhr.onerror = function () {
                    info.innerText = '❌ Erreur réseau';
                };
                xhr.send();

                // Animation loop
                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

                // Resize
                window.addEventListener('resize', function () {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

            } catch (e) {
                info.innerHTML = '❌ Erreur init: ' + e.message;
            }
        }

        function loadModel(url, scene) {
            info.innerText = 'Chargement modèle...';

            if (typeof THREE.OBJLoader === 'undefined') {
                info.innerText = '❌ OBJLoader non disponible';
                return;
            }

            var loader = new THREE.OBJLoader();

            loader.load(
                url,
                function (object) {
                    // Center and scale
                    var box = new THREE.Box3().setFromObject(object);
                    var center = box.getCenter(new THREE.Vector3());
                    var size = box.getSize(new THREE.Vector3());
                    var maxDim = Math.max(size.x, size.y, size.z);
                    var scale = 5 / maxDim;

                    object.position.sub(center);
                    object.scale.set(scale, scale, scale);

                    // Apply material
                    object.traverse(function (child) {
                        if (child.isMesh) {
                            child.material = new THREE.MeshPhongMaterial({
                                color: 0xcccccc,
                                shininess: 30
                            });
                        }
                    });

                    scene.add(object);
                    rotationObject = object; // Enable mouse rotation

                    info.innerText = '✅ Modèle chargé ! Glissez pour tourner';
                    setTimeout(function () {
                        info.style.display = 'none';
                    }, 3000);
                },
                function (xhr) {
                    var percent = Math.round((xhr.loaded / xhr.total) * 100);
                    info.innerText = 'Chargement... ' + percent + '%';
                },
                function (error) {
                    console.error('Load error:', error);
                    info.innerHTML = '❌ Erreur chargement<br>' + error;
                }
            );
        }
    </script>
</body>

</html>
