<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial;
            font-size: 14px;
            z-index: 100;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="info">Chargement...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const info = document.getElementById('info');

        // Extract jobId from URL
        const pathParts = window.location.pathname.split('/');
        const jobId = pathParts[pathParts.length - 1];

        info.innerText = `Job ${jobId} - Initialisation...`;

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 50;

        // Load model
        info.innerText = 'Connexion serveur...';

        fetch(`/jobs/${jobId}`)
            .then(response => {
                if (!response.ok) throw new Error('Job not found');
                return response.json();
            })
            .then(job => {
                if (!job.objUrl) {
                    throw new Error('No OBJ file');
                }

                info.innerText = 'Chargement modèle...';

                const loader = new OBJLoader();

                loader.load(
                    job.objUrl,
                    (object) => {
                        // Center and scale
                        const box = new THREE.Box3().setFromObject(object);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 5 / maxDim;

                        object.position.sub(center);
                        object.scale.setScalar(scale);

                        // Apply material
                        object.traverse((child) => {
                            if (child.isMesh) {
                                child.material = new THREE.MeshPhongMaterial({
                                    color: 0xcccccc,
                                    shininess: 30,
                                    flatShading: false
                                });
                            }
                        });

                        scene.add(object);

                        info.innerText = '✅ Modèle chargé ! Glissez pour tourner';
                        setTimeout(() => {
                            info.style.display = 'none';
                        }, 3000);
                    },
                    (xhr) => {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        info.innerText = `Chargement... ${percent}%`;
                    },
                    (error) => {
                        console.error('Load error:', error);
                        info.innerText = '❌ Erreur chargement';
                        info.style.color = '#ff4444';
                    }
                );
            })
            .catch(error => {
                console.error('Fetch error:', error);
                info.innerText = `❌ ${error.message}`;
                info.style.color = '#ff4444';
            });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
