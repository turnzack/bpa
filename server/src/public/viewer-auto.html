<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur 3D - SolarScan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        #status {
            font-size: 14px;
            color: #4ade80;
        }

        #viewer-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="header">
        <h1>📦 Visualiseur 3D - SolarScan</h1>
        <div id="status">Chargement du modèle...</div>
    </div>

    <div id="viewer-container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Chargement de votre scan 3D...</p>
        </div>
    </div>

    <script>
        // Récupérer le jobId depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('jobId') || window.location.pathname.split('/').pop();

        console.log('Job ID:', jobId);

        // Construire les URLs des fichiers
        const baseUrl = window.location.origin;
        const objUrl = `${baseUrl}/data/jobs/${jobId}/output/texturedMesh.obj`;
        const mtlUrl = `${baseUrl}/data/jobs/${jobId}/output/texturedMesh.mtl`;

        console.log('OBJ URL:', objUrl);
        console.log('MTL URL:', mtlUrl);

        // Mettre à jour le statut
        document.getElementById('status').textContent = `Scan #${jobId}`;

        // Créer l'URL pour 3dviewer.net avec nos fichiers
        const viewerUrl = `https://3dviewer.net/#model=${encodeURIComponent(objUrl)},${encodeURIComponent(mtlUrl)}`;

        console.log('Viewer URL:', viewerUrl);

        // Créer l'iframe après un court délai
        setTimeout(() => {
            const iframe = document.createElement('iframe');
            iframe.src = viewerUrl;
            iframe.onload = () => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = `✅ Scan #${jobId} chargé`;
            };

            // Supprimer le message de chargement et ajouter l'iframe
            const container = document.getElementById('viewer-container');
            container.innerHTML = '';
            container.appendChild(iframe);
        }, 500);
    </script>
</body>

</html>
