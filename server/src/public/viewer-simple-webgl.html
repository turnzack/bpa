<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur 3D - SolarScan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        #status {
            font-size: 12px;
            color: #4ade80;
        }

        #container {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            bottom: 60px;
        }

        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px;
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        .control-btn.active {
            background: #4ade80;
            border-color: #4ade80;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 14px;
            z-index: 100;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff6b6b;
            font-size: 13px;
            max-width: 80%;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
        }

        #info {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="header">
        <h1>📦 Visualiseur 3D</h1>
        <div id="status">Chargement...</div>
    </div>

    <div id="info">
        🔄 Rotation: 1 doigt<br>
        📍 Déplacer: 2 doigts<br>
        🔍 Zoom: Pinch
    </div>

    <div id="container"></div>

    <div id="controls">
        <button class="control-btn" id="btn-wireframe">🔲 Fil de fer</button>
        <button class="control-btn active" id="btn-autorotate">🔄 Auto</button>
        <button class="control-btn" id="btn-light">💡 Lumière</button>
        <button class="control-btn" id="btn-background">🎨 Fond</button>
        <button class="control-btn" id="btn-reset">🎯 Reset</button>
        <button class="control-btn" id="btn-screenshot">📸 Photo</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Chargement du modèle 3D...</p>
    </div>

    <div id="error">
        <h2>❌ Erreur</h2>
        <p id="error-message"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script>
        const jobId = window.location.pathname.split('/').pop();
        const baseUrl = window.location.origin;

        console.log('Job ID:', jobId);

        document.getElementById('status').textContent = `Scan #${jobId}`;

        // Variables Three.js
        let scene, camera, renderer, model;
        let autoRotate = true;
        let wireframeMode = false;
        let lightIntensity = 1.0;

        // Couleurs de fond disponibles
        const backgroundColors = [
            { name: 'Sombre', color: 0x1a1a2e },
            { name: 'Noir', color: 0x000000 },
            { name: 'Blanc', color: 0xffffff },
            { name: 'Gris', color: 0x808080 },
            { name: 'Bleu nuit', color: 0x0a1929 },
            { name: 'Gradient bleu', color: 0x1e3a5f }
        ];
        let currentBgIndex = 0;

        // Variables de contrôle tactile
        let touches = [];
        let lastDistance = 0;
        let lastPanX = 0, lastPanY = 0;
        let cameraDistance = 5;
        let cameraRotationX = 0, cameraRotationY = 0;
        let panX = 0, panY = 0;

        // Variables pour le suivi du mouvement
        let lastTouchX = 0, lastTouchY = 0;
        let touchStarted = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            const container = document.getElementById('container');
            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lumières
            window.ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(window.ambientLight);

            window.directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            window.directionalLight1.position.set(1, 1, 1);
            scene.add(window.directionalLight1);

            window.directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            window.directionalLight2.position.set(-1, -1, -1);
            scene.add(window.directionalLight2);

            loadModel();

            window.addEventListener('resize', onWindowResize);
            setupTouchControls();
            setupButtons();

            animate();
        }

        function updateCameraPosition() {
            camera.position.x = cameraDistance * Math.sin(cameraRotationY) * Math.cos(cameraRotationX);
            camera.position.y = cameraDistance * Math.sin(cameraRotationX);
            camera.position.z = cameraDistance * Math.cos(cameraRotationY) * Math.cos(cameraRotationX);
            camera.lookAt(panX, panY, 0);
        }

        function setupTouchControls() {
            const container = document.getElementById('container');

            container.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touches = Array.from(e.touches);

                if (touches.length === 1) {
                    // Initialiser le suivi pour la rotation
                    lastTouchX = touches[0].clientX;
                    lastTouchY = touches[0].clientY;
                    touchStarted = true;
                } else if (touches.length === 2) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    lastDistance = Math.sqrt(dx * dx + dy * dy);
                    lastPanX = (touches[0].clientX + touches[1].clientX) / 2;
                    lastPanY = (touches[0].clientY + touches[1].clientY) / 2;
                    touchStarted = false;
                }
            });

            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                touches = Array.from(e.touches);

                if (touches.length === 1 && touchStarted) {
                    // Rotation avec 1 doigt - AMÉLIORÉ
                    const currentX = touches[0].clientX;
                    const currentY = touches[0].clientY;

                    const deltaX = currentX - lastTouchX;
                    const deltaY = currentY - lastTouchY;

                    // Rotation plus sensible et fluide
                    cameraRotationY += deltaX * 0.015;  // Augmenté pour plus de sensibilité
                    cameraRotationX -= deltaY * 0.015;  // Inversé pour rotation naturelle

                    // Limiter la rotation verticale pour éviter le flip
                    cameraRotationX = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraRotationX));

                    updateCameraPosition();

                    lastTouchX = currentX;
                    lastTouchY = currentY;
                } else if (touches.length === 2) {
                    touchStarted = false;

                    // Zoom avec pinch
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (lastDistance > 0) {
                        const delta = distance - lastDistance;
                        cameraDistance = Math.max(1, Math.min(20, cameraDistance - delta * 0.02));
                        updateCameraPosition();
                    }

                    lastDistance = distance;

                    // Pan avec 2 doigts
                    const centerX = (touches[0].clientX + touches[1].clientX) / 2;
                    const centerY = (touches[0].clientY + touches[1].clientY) / 2;

                    if (lastPanX !== 0) {
                        const deltaX = centerX - lastPanX;
                        const deltaY = centerY - lastPanY;

                        panX += deltaX * 0.01;
                        panY -= deltaY * 0.01;
                        updateCameraPosition();
                    }

                    lastPanX = centerX;
                    lastPanY = centerY;
                }
            });

            container.addEventListener('touchend', (e) => {
                touches = Array.from(e.touches);
                if (touches.length < 2) {
                    lastDistance = 0;
                    lastPanX = 0;
                    lastPanY = 0;
                }
                if (touches.length === 0) {
                    touchStarted = false;
                }
            });
        }

        function setupButtons() {
            document.getElementById('btn-wireframe').addEventListener('click', () => {
                wireframeMode = !wireframeMode;
                if (model) {
                    model.traverse((child) => {
                        if (child instanceof THREE.Mesh) {
                            child.material.wireframe = wireframeMode;
                        }
                    });
                }
                document.getElementById('btn-wireframe').classList.toggle('active');
            });

            document.getElementById('btn-autorotate').addEventListener('click', () => {
                autoRotate = !autoRotate;
                document.getElementById('btn-autorotate').classList.toggle('active');
            });

            document.getElementById('btn-light').addEventListener('click', () => {
                lightIntensity = lightIntensity === 1.0 ? 0.3 : 1.0;

                console.log('💡 Changement lumière:', lightIntensity);

                // Ajuster toutes les lumières
                if (window.ambientLight) {
                    window.ambientLight.intensity = lightIntensity * 0.6;
                }
                if (window.directionalLight1) {
                    window.directionalLight1.intensity = lightIntensity * 0.8;
                }
                if (window.directionalLight2) {
                    window.directionalLight2.intensity = lightIntensity * 0.4;
                }

                document.getElementById('btn-light').classList.toggle('active');

                // Feedback visuel
                const status = document.getElementById('status');
                const oldText = status.textContent;
                status.textContent = lightIntensity === 1.0 ? '💡 Lumière normale' : '🌙 Lumière faible';
                setTimeout(() => {
                    status.textContent = oldText;
                }, 1500);
            });

            document.getElementById('btn-background').addEventListener('click', () => {
                // Passer à la couleur suivante
                currentBgIndex = (currentBgIndex + 1) % backgroundColors.length;
                const bg = backgroundColors[currentBgIndex];

                console.log('🎨 Changement fond:', bg.name);

                // Changer la couleur de fond de la scène
                scene.background = new THREE.Color(bg.color);

                // Feedback visuel
                const status = document.getElementById('status');
                const oldText = status.textContent;
                status.textContent = `🎨 Fond: ${bg.name}`;
                setTimeout(() => {
                    status.textContent = oldText;
                }, 1500);
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                cameraDistance = 5;
                cameraRotationX = 0;
                cameraRotationY = 0;
                panX = 0;
                panY = 0;
                updateCameraPosition();
            });

            document.getElementById('btn-screenshot').addEventListener('click', () => {
                const dataURL = renderer.domElement.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `scan_${jobId}.png`;
                link.href = dataURL;
                link.click();

                document.getElementById('status').textContent = '📸 Capture sauvegardée!';
                setTimeout(() => {
                    document.getElementById('status').textContent = `✅ Scan #${jobId}`;
                }, 2000);
            });
        }

        function loadModel() {
            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.setPath(baseUrl + `/data/jobs/${jobId}/output/`);

            mtlLoader.load('texturedMesh.mtl',
                function (materials) {
                    materials.preload();
                    console.log('✅ MTL chargé');

                    const objLoader = new THREE.OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.setPath(baseUrl + `/data/jobs/${jobId}/output/`);

                    objLoader.load('texturedMesh.obj',
                        function (object) {
                            console.log('✅ OBJ chargé');

                            const box = new THREE.Box3().setFromObject(object);
                            const center = box.getCenter(new THREE.Vector3());
                            const size = box.getSize(new THREE.Vector3());

                            const maxDim = Math.max(size.x, size.y, size.z);
                            const scale = 3 / maxDim;

                            object.position.sub(center);
                            object.scale.multiplyScalar(scale);

                            model = object;
                            scene.add(model);

                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('status').textContent = `✅ Scan #${jobId}`;
                        },
                        function (xhr) {
                            const percent = Math.round((xhr.loaded / xhr.total) * 100);
                            document.getElementById('loading').querySelector('p').textContent =
                                `Chargement: ${percent}%`;
                        },
                        function (error) {
                            console.error('❌ Erreur OBJ:', error);
                            loadObjOnly();
                        }
                    );
                },
                null,
                function (error) {
                    console.error('❌ Erreur MTL:', error);
                    loadObjOnly();
                }
            );
        }

        function loadObjOnly() {
            const objLoader = new THREE.OBJLoader();
            objLoader.setPath(baseUrl + `/data/jobs/${jobId}/output/`);

            objLoader.load('texturedMesh.obj',
                function (object) {
                    object.traverse(function (child) {
                        if (child instanceof THREE.Mesh) {
                            child.material = new THREE.MeshPhongMaterial({
                                color: 0x888888,
                                side: THREE.DoubleSide
                            });
                        }
                    });

                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3 / maxDim;

                    object.position.sub(center);
                    object.scale.multiplyScalar(scale);

                    model = object;
                    scene.add(model);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('status').textContent = `✅ Scan #${jobId} (sans textures)`;
                },
                null,
                function (error) {
                    showError('Impossible de charger le modèle 3D');
                }
            );
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
            document.getElementById('status').textContent = '❌ Erreur';
        }

        function onWindowResize() {
            const container = document.getElementById('container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (model && autoRotate) {
                cameraRotationY += 0.003;
                updateCameraPosition();
            }

            renderer.render(scene, camera);
        }

        try {
            init();
        } catch (error) {
            console.error('Erreur:', error);
            showError(error.message);
        }
    </script>
</body>

</html>
